# Copy to a private compose.yaml. See docs/SELF_HOSTING.md before starting.
services:
  kroger:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22.23.2-bookworm-slim}
    image: houston-i-love-kroger:local
    init: true
    user: node
    read_only: true
    environment:
      HOST: 0.0.0.0
      PORT: "4173"
      APP_BASE_PATH: /apps/houston-i-love-kroger/
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://groceries.example}
      HISTORY_DB_PATH: /data/history.sqlite
      KROGER_ENVIRONMENT: production
      # This example deliberately serves setup guidance without supplier access.
      KROGER_CLIENT_ID: ""
      KROGER_CLIENT_SECRET: ""
    volumes:
      - history:/data
    networks:
      - gateway
    # No ports are published. A reverse proxy on this network is the public edge.
    cpus: ${APP_CPUS:-0.5}
    mem_limit: ${APP_MEMORY:-256m}
    pids_limit: ${APP_PIDS:-64}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    restart: "on-failure:5"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  history:

networks:
  gateway:
    external: true
    name: ${GATEWAY_NETWORK:-app-gateway}
