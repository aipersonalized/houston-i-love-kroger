metadata:
  scope: "Database-only companion for the project's stored deals and history"
SKILL.md:
  _purpose: "Terms that select a stored read or setup task"
  "Latest collected deals": "Qualifying dated prices from the latest completed exact-store/topic snapshot within the operator freshness policy."
  "Operational candidate": "Authored instructions and bounded checks; actual installation and model qualification remain separate."
playbooks:
  _purpose: "Accepted task identity and finish conditions"
  "Accepted store": "The complete eight-character locationId already chosen by the person; no stored directory is currently supplied."
  "Collection topic": "The exact operator-approved topic label, distinct from a historical description filter."
  "Fresh empty": "A recent completed sample with zero qualifying deals, replacing older deals for its scope."
  "No data": "No usable completed exact-scope collection, distinct from a fresh empty sample."
  "Stale": "A completed snapshot older than the operator freshness threshold, with deals withheld."
references:
  _purpose: "Source facts, calculations and authority"
  "Source fact": "A reported value preserved separately from arithmetic."
  "Recipient": "Every actual viewer/processor, including tools, agent hosts and model services."
  "Unit basis": "The explicit standardized measure needed for a normalized unit price."
  "Historical observation": "A retained dated fact with limited past coverage, not a current offer."
  "Stored price check": "A dated item/package price with usable regular/promo pricing or an explicit unavailable reason."
  "Complete estimate": "Every requested line has arithmetic, without guaranteeing a payable checkout total."
  "Partial estimate": "Only resolved requested lines contribute supported amounts; unresolved lines stay explicit."
  "Qualified subtotal": "A same-currency estimate with no unresolved line or required source-context gap, still excluding checkout conditions."
  "Unreported currency": "Missing source currency; no inferred currency symbol or qualified monetary total."
scripts:
  _purpose: "Stored-read client and local public documentation maintenance"
  "repo:/": "Logical identifier for the reviewed first-party manual inventory."
  "Source freshness": "Whether documentation snapshot bytes match a supplied current app checkout."
  "Snapshot freshness": "Age of a completed collection under an operator threshold, not a supplier validity guarantee."
